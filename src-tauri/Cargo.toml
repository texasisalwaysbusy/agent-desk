[package]
name = "agent-desk-launcher"
version = "1.2.3"
description = "Agent Desk desktop launcher"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSRunningApplication"] }
